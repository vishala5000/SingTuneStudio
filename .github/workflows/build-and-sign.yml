name: Build and Auto-Sign APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Generate CI Keystore
        run: |
          keytool -genkey -v -keystore ${{ github.workspace }}/ci-debug.keystore \
          -storepass android -alias androiddebugkey -keypass android \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=SingTune, OU=Dev, O=Studio, L=Offline, ST=Cloud, C=US"

      - name: Strip Default Signature, Zipalign, and Sign with apksigner
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp $APK_PATH unsigned.apk
          zip -d unsigned.apk "META-INF/*" > /dev/null
          
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v -p 4 unsigned.apk aligned.apk
          
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks ${{ github.workspace }}/ci-debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            aligned.apk
          
          mv aligned.apk SingTune-Studio-Offline-Signed.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SingTune-Studio-APK
          path: SingTune-Studio-Offline-Signed.apk
